## My Previous Blog System</textarea></section><section data-markdown><textarea data-template>## Blog Platform Attempts

Platforms I&#39;ve used:

&lt;p class=&quot;fragment&quot;&gt;📝 CSDN / Cnblogs&lt;/p&gt;
&lt;p class=&quot;fragment&quot;&gt;📘 Zhihu Column&lt;/p&gt;
&lt;p class=&quot;fragment&quot;&gt;🐙 GitHub + Jekyll&lt;/p&gt;
&lt;p class=&quot;fragment&quot;&gt;📖 Hexo&lt;/p&gt;
&lt;p class=&quot;fragment&quot;&gt;📚 VuePress / VitePress&lt;/p&gt;</textarea></section><section data-markdown><textarea data-template>## Third-Party Platforms

&lt;div style=&quot;display: flex; gap: 2em;&quot;&gt;
&lt;div style=&quot;flex: 1; background: rgba(76, 175, 80, 0.1); padding: 1em; border-radius: 8px; border-left: 4px solid #4CAF50;&quot;&gt;

### ✅ Pros

- Zero cost to start
- Built-in traffic and exposure
- No server maintenance needed

&lt;/div&gt;
&lt;div style=&quot;flex: 1; background: rgba(244, 67, 54, 0.1); padding: 1em; border-radius: 8px; border-left: 4px solid #F44336;&quot;&gt;

### ❌ Cons

- Advertisement interference
- Uncontrollable styling
- Data not fully owned
- May be throttled or censored

&lt;/div&gt;
&lt;/div&gt;</textarea></section><section data-markdown><textarea data-template>## Static Site Generators

**Jekyll / Hexo / Hugo**

&lt;div style=&quot;display: flex; gap: 2em;&quot;&gt;
&lt;div style=&quot;flex: 1; background: rgba(76, 175, 80, 0.1); padding: 1em; border-radius: 8px; border-left: 4px solid #4CAF50;&quot;&gt;

### ✅ Pros

- Full control over content
- Markdown writing
- Free hosting (GitHub Pages)

&lt;/div&gt;
&lt;div style=&quot;flex: 1; background: rgba(244, 67, 54, 0.1); padding: 1em; border-radius: 8px; border-left: 4px solid #F44336;&quot;&gt;

### ❌ Cons

- Complex theme customization
- Limited feature extension
- Some frameworks have outdated ecosystems

&lt;/div&gt;
&lt;/div&gt;</textarea></section><section data-markdown><textarea data-template>## Documentation Tools

**VuePress / VitePress**

&lt;div style=&quot;display: flex; gap: 2em;&quot;&gt;
&lt;div style=&quot;flex: 1; background: rgba(76, 175, 80, 0.1); padding: 1em; border-radius: 8px; border-left: 4px solid #4CAF50;&quot;&gt;

### ✅ Pros

- Vue ecosystem, highly extensible
- Suitable for technical documentation

&lt;/div&gt;
&lt;div style=&quot;flex: 1; background: rgba(244, 67, 54, 0.1); padding: 1em; border-radius: 8px; border-left: 4px solid #F44336;&quot;&gt;

### ❌ Cons

- Blog features require extra configuration
- More oriented toward documentation than blogs

&lt;/div&gt;
&lt;/div&gt;</textarea></section><section data-markdown><textarea data-template>## Pain Points Summary

&lt;p class=&quot;fragment&quot;&gt;🎨 Themes difficult to meet personalization needs&lt;/p&gt;
&lt;p class=&quot;fragment&quot;&gt;📊 Lack of mathematical formulas and chart support&lt;/p&gt;
&lt;p class=&quot;fragment&quot;&gt;🎬 Want slide presentation functionality&lt;/p&gt;
&lt;p class=&quot;fragment&quot;&gt;⚡ Pursuing better performance and developer experience&lt;/p&gt;</textarea></section></section><section><section data-markdown><textarea data-template># Chapter 3

## My Custom Blog System</textarea></section><section data-markdown><textarea data-template>## Why Choose Astro

| Feature | Description |
|------|------|
| **Island Architecture** | Load JS on demand, ultimate performance |
| **Framework Agnostic** | Supports Vue/React/Svelte |
| **Content First** | Designed specifically for content sites |
| **Modern Toolchain** | Vite-powered, great developer experience |</textarea></section><section data-markdown><textarea data-template>## Tech Stack

```
Astro 5        Static site generation
Vue 3          Interactive components
TypeScript     Type safety
Tailwind CSS   Atomic styling
Reveal.js      Slide presentations
```</textarea></section><section data-markdown><textarea data-template>## Core Features

&lt;p class=&quot;fragment&quot;&gt;✅ Markdown / MDX support&lt;/p&gt;
&lt;p class=&quot;fragment&quot;&gt;✅ Code highlighting (100+ languages)&lt;/p&gt;
&lt;p class=&quot;fragment&quot;&gt;✅ Mathematical formulas (KaTeX)&lt;/p&gt;
&lt;p class=&quot;fragment&quot;&gt;✅ Flowcharts (Mermaid)&lt;/p&gt;
&lt;p class=&quot;fragment&quot;&gt;✅ Data visualization (ECharts)&lt;/p&gt;
&lt;p class=&quot;fragment&quot;&gt;✅ Slide presentations (Reveal.js)&lt;/p&gt;</textarea></section><section data-markdown><textarea data-template>## Content Organization

```
content/
├── posts/           # Blog posts
│   ├── math/       # Math notes
│   ├── tools/      # Tool tutorials
│   └── media/      # Presentations
├── pages/          # Static pages
└── slides/         # Independent slides
```</textarea></section><section data-markdown><textarea data-template>## Feature: Tip Containers

```markdown
::: tip Tip
This is a tip
:::

::: warning Warning
This is a warning message
:::

::: danger Danger
This is a danger warning
:::
```</textarea></section><section data-markdown><textarea data-template>## Feature: Mermaid Charts

Supports multiple chart types:

- Flowcharts
- Sequence diagrams
- Class diagrams
- Gantt charts
- State diagrams</textarea></section><section data-markdown><textarea data-template>## Feature: Slides

Three usage methods:

| Method | Description |
|------|------|
| Independent slides | `content/slides/` |
| Article to slides | `layout: slides` |
| Embedded | `&lt;Slides&gt;` component |

Just like what you&#39;re seeing now!</textarea></section><section data-markdown><textarea data-template>## Developer Experience

- 🔥 Hot reload, real-time preview

- 🎨 Tailwind rapid styling
- 📝 Pure Markdown writing</textarea></section></section><section><section data-markdown><textarea data-template># Chapter 4
