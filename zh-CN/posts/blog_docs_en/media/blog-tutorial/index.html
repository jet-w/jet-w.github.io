1. **System Overview** - Understand blog architecture
2. **Quick Start** - Installation and running

## System Overview</textarea></section><section data-markdown><textarea data-template>## Tech Stack

| Technology | Purpose |
|------|------|
| **Astro 5** | Static site generator |
| **Vue 3** | Interactive components |
| **TypeScript** | Type safety |
| **Tailwind CSS** | Styling system |
| **Reveal.js** | Slide presentations |</textarea></section><section data-markdown><textarea data-template>## Main Features

&lt;p class=&quot;fragment&quot;&gt;Markdown &amp; MDX support&lt;/p&gt;
&lt;p class=&quot;fragment&quot;&gt;Code highlighting (100+ languages)&lt;/p&gt;
&lt;p class=&quot;fragment&quot;&gt;Mathematical formulas (LaTeX/KaTeX)&lt;/p&gt;
&lt;p class=&quot;fragment&quot;&gt;Flowcharts (Mermaid)&lt;/p&gt;
&lt;p class=&quot;fragment&quot;&gt;Data visualization (ECharts)&lt;/p&gt;
&lt;p class=&quot;fragment&quot;&gt;Slide presentations (Reveal.js)&lt;/p&gt;</textarea></section><section data-markdown><textarea data-template>## Directory Structure

```
blog/
├── content/           # Content directory
│   ├── posts/        # Blog posts
│   ├── pages/        # Static pages
│   └── slides/       # Independent slides
├── src/
│   ├── config/       # Configuration files
│   ├── components/   # Components
│   ├── layouts/      # Layout templates
│   └── plugins/      # Markdown plugins
└── public/           # Static assets
```</textarea></section></section><section><section data-markdown><textarea data-template># Chapter 2

## Quick Start</textarea></section><section data-markdown><textarea data-template>## Environment Requirements

- **Node.js** 18.0 or higher
- **npm** or **pnpm** package manager
- Code editor (VS Code recommended)</textarea></section><section data-markdown><textarea data-template>## Installation Steps

```bash
# 1. Clone project
git clone &lt;repository-url&gt;

# 2. Enter directory
cd astro-blog

# 3. Install dependencies
npm install

# 4. Start development server
npm run dev
```</textarea></section><section data-markdown><textarea data-template>## Common Commands

| Command | Description |
|------|------|
| `npm run dev` | Start development server |
| `npm run build` | Build production version |
| `npm run preview` | Preview build results |

Visit `http://localhost:4321` to view the blog</textarea></section></section><section><section data-markdown><textarea data-template># Chapter 3

## Content Creation</textarea></section><section data-markdown><textarea data-template>## Creating Articles

Create `.md` files in the `content/posts/` directory:

```
content/posts/
├── my-first-post.md      # Root directory article
├── tutorial/
│   ├── README.md         # Directory index
│   └── getting-started.md
└── projects/
    └── project-a.md
```</textarea></section><section data-markdown><textarea data-template>## Frontmatter Configuration

Each article must start with metadata in YAML format:

```yaml</textarea></section></section><section><section data-markdown><textarea data-template>title: Article Title (required)
description: Article description
pubDate: 2025-01-05
author: Author name
tags: [tag1, tag2]
categories: [category]
draft: false
star: false</textarea></section></section><section><section data-markdown><textarea data-template>```</textarea></section><section data-markdown><textarea data-template>## Required and Optional Fields

| Field | Required | Description |
|------|:----:|------|
| `title` | ✅ | Article title |
| `pubDate` | ✅ | Publication date |
| `description` | - | SEO description |
| `author` | - | Author name |
| `tags` | - | Tag list |
| `categories` | - | Categories |
| `draft` | - | Draft status |</textarea></section><section data-markdown><textarea data-template>## URL Mapping Rules

File path determines access URL:

| File Path | Access URL |
|----------|----------|
| `posts/hello.md` | `/posts/hello` |
| `posts/guide/intro.md` | `/posts/guide/intro` |
| `posts/guide/README.md` | `/posts/guide` |</textarea></section></section><section><section data-markdown><textarea data-template># Chapter 4

## Featured Functions</textarea></section><section data-markdown><textarea data-template>## Tip Containers

Six preset container styles:

```markdown
::: tip Tip
This is a tip message
:::

::: warning Warning
This is a warning message
:::

::: danger Danger
This is a danger warning
:::
```</textarea></section><section data-markdown><textarea data-template>## Container Types Overview

| Type | Icon | Purpose |
|------|------|------|
| `tip` | 💡 | Tips and suggestions |
| `info` | ℹ️ | Additional information |
| `note` | 📝 | Important notes |
| `warning` | ⚠️ | Warning reminders |
| `danger` | 🚨 | Danger alerts |
| `details` | 📋 | Collapsible content |</textarea></section><section data-markdown><textarea data-template>## Code Highlighting

Supports 100+ programming languages:

````markdown
```javascript
function hello(name) {
  console.log(`Hello, ${name}!`);
}
```

```python
def hello(name):
    print(f&quot;Hello, {name}!&quot;)
```
````</textarea></section><section data-markdown><textarea data-template>## Mathematical Formulas

Use LaTeX syntax:

**Inline formula:** `$E = mc^2$`

**Block formula:**
```latex
$$
\int_{-\infty}^{\infty} e^{-x^2} dx = \sqrt{\pi}
$$
```</textarea></section><section data-markdown><textarea data-template>## Mermaid Flowcharts

````markdown
```mermaid
graph TD
    A[Start] --&gt; B{Condition}
    B --&gt;|Yes| C[Execute]
    B --&gt;|No| D[Skip]
    C --&gt; E[End]
    D --&gt; E
```
````</textarea></section><section data-markdown><textarea data-template>## Mermaid Chart Types

- **Flowcharts** - `graph TD/LR/BT/RL`
- **Sequence Diagrams** - `sequenceDiagram`
- **Class Diagrams** - `classDiagram`
- **Gantt Charts** - `gantt`
- **Pie Charts** - `pie`
- **State Diagrams** - `stateDiagram-v2`</textarea></section><section data-markdown><textarea data-template>## ECharts Charts

Interactive charts supported in slides:

````markdown
```echarts
{
  &quot;xAxis&quot;: { &quot;type&quot;: &quot;category&quot;, &quot;data&quot;: [&quot;A&quot;, &quot;B&quot;, &quot;C&quot;] },
  &quot;yAxis&quot;: { &quot;type&quot;: &quot;value&quot; },
  &quot;series&quot;: [{ &quot;data&quot;: [120, 200, 150], &quot;type&quot;: &quot;bar&quot; }]
}
```
````</textarea></section></section><section><section data-markdown><textarea data-template># Chapter 5

## Slide Presentations</textarea></section><section data-markdown><textarea data-template>## Three Usage Methods

| Method | Location | Description |
|------|------|------|
| Independent slides | `content/slides/` | Dedicated presentation pages |
| Article slides | `content/posts/` | `layout: slides` |
| Embedded slides | `.mdx` files | `&lt;Slides&gt;` component |</textarea></section><section data-markdown><textarea data-template>## Method 1: Independent Slides

Create files in `content/slides/`:

```markdown</textarea></section></section><section><section data-markdown><textarea data-template>title: My Presentation
theme: black
slideNumber: true</textarea></section></section><section><section data-markdown><textarea data-template># First Page

Content...</textarea></section></section><section><section data-markdown><textarea data-template># Second Page

Use `---` to separate slides
```</textarea></section><section data-markdown><textarea data-template>## Method 2: Article Slides

Set `layout: slides` in frontmatter:

```yaml</textarea></section></section><section><section data-markdown><textarea data-template>title: Tech Sharing
pubDate: 2025-01-05
layout: slides
theme: white
transition: fade</textarea></section></section><section><section data-markdown><textarea data-template>```

The entire article will render as slides</textarea></section><section data-markdown><textarea data-template>## Method 3: Embedded Slides

Use component in `.mdx` files:

```jsx
import Slides from &#39;@/components/media/Slides.astro&#39;;

&lt;Slides src=&quot;/slides/demo&quot; height=&quot;400px&quot; /&gt;

// Or inline content
&lt;Slides height=&quot;400px&quot;&gt;
# Title
Content...
&lt;/Slides&gt;
```</textarea></section><section data-markdown><textarea data-template>## Slide Separators

| Separator | Direction | Description |
|--------|------|------|
| `---` | Horizontal ➡️ | Main content |
| `----` | Vertical ⬇️ | Section sub-content |

```markdown
# Chapter 1 (Press →)</textarea></section></section><section><section data-markdown><textarea data-template># Chapter 2</textarea></section><section data-markdown><textarea data-template>## 2.1 Details (Press ↓)</textarea></section><section data-markdown><textarea data-template>## 2.2 More</textarea></section></section><section><section data-markdown><textarea data-template># Chapter 3
```</textarea></section><section data-markdown><textarea data-template>## Available Themes

| Theme | Style |
|------|------|
| `black` | Black background (default) |
| `white` | White background |
| `league` | Dark gray business style |
| `night` | Deep blue night mode |
| `solarized` | Developer color scheme |
| `moon` | Deep blue moonlight style |</textarea></section><section data-markdown><textarea data-template>## Keyboard Shortcuts

| Key | Function |
|------|------|
| `→` / `Space` | Next page |
| `←` | Previous page |
| `↑` / `↓` | Vertical navigation |
| `Esc` / `O` | Overview mode |
| `F` | Full screen |
| `S` | Speaker view |</textarea></section></section><section><section data-markdown><textarea data-template># Chapter 6

## Configuration Customization</textarea></section><section data-markdown><textarea data-template>## Site Configuration

Edit `src/config/site.ts`:

```typescript
export const siteConfig = {
  title: &quot;My Blog&quot;,
  description: &quot;Blog description&quot;,
  author: &quot;Author name&quot;,
  email: &quot;email@example.com&quot;,
  avatar: &quot;/avatar.png&quot;,
}
```</textarea></section><section data-markdown><textarea data-template>## Social Links

Edit `src/config/social.ts`:

```typescript
export const socialLinks = [
  { name: &#39;GitHub&#39;, url: &#39;https://github.com/xxx&#39; },
  { name: &#39;Twitter&#39;, url: &#39;https://twitter.com/xxx&#39; },
  { name: &#39;Email&#39;, url: &#39;mailto:xxx@example.com&#39; },
]
```</textarea></section><section data-markdown><textarea data-template>## Navigation Menu

Edit `src/config/menu.ts`:

```typescript
export const menuItems = [
  { title: &#39;Home&#39;, path: &#39;/&#39; },
  { title: &#39;Blog&#39;, path: &#39;/posts&#39; },
  { title: &#39;About&#39;, path: &#39;/about&#39; },
]
```</textarea></section></section><section><section data-markdown><textarea data-template># Chapter 7

## Deployment</textarea></section><section data-markdown><textarea data-template>## Build Production Version

```bash
# Build
npm run build

# Local preview
npm run preview
```

Build output in `dist/` directory</textarea></section><section data-markdown><textarea data-template>## Deployment Platforms

| Platform | Features |
|------|------|
| **Vercel** | Zero configuration, auto deploy |
| **Netlify** | Feature-rich, CDN acceleration |
| **GitHub Pages** | Free, suitable for open source projects |
| **Cloudflare Pages** | Global CDN, fast speed |</textarea></section><section data-markdown><textarea data-template>## Vercel Deployment

1. Push code to GitHub
2. Import project in Vercel
3. Automatically detect Astro framework
4. Click Deploy

Auto-updates on every push!</textarea></section><section data-markdown><textarea data-template>## GitHub Pages Deployment

```yaml
# .github/workflows/deploy.yml
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
      - run: npm install &amp;&amp; npm run build
      - uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
```</textarea></section></section><section><section data-markdown><textarea data-template># Summary</textarea></section><section data-markdown><textarea data-template>## Key Points Review
