&lt;p class=&quot;fragment&quot;&gt;求职时的加分项&lt;/p&gt;
&lt;p class=&quot;fragment&quot;&gt;持续学习的证明&lt;/p&gt;</textarea></section><section data-markdown><textarea data-template>## 总结：为什么写博客

| 费曼学习 | 深入理解知识 |
| 分享交流 | 社区连接 |
| 个人品牌 | 职业发展 |</textarea></section></section><section><section data-markdown><textarea data-template># 第二章

## 我之前用的博客系统</textarea></section><section data-markdown><textarea data-template>## 博客平台的尝试

使用过的平台：

&lt;p class=&quot;fragment&quot;&gt;📝 CSDN / 博客园&lt;/p&gt;
&lt;p class=&quot;fragment&quot;&gt;📘 知乎专栏&lt;/p&gt;
&lt;p class=&quot;fragment&quot;&gt;🐙 GitHub + Jekyll&lt;/p&gt;
&lt;p class=&quot;fragment&quot;&gt;📖 Hexo&lt;/p&gt;
&lt;p class=&quot;fragment&quot;&gt;📚 VuePress / VitePress&lt;/p&gt;</textarea></section><section data-markdown><textarea data-template>## 第三方平台

&lt;div style=&quot;display: flex; gap: 2em;&quot;&gt;
&lt;div style=&quot;flex: 1; background: rgba(76, 175, 80, 0.1); padding: 1em; border-radius: 8px; border-left: 4px solid #4CAF50;&quot;&gt;

### ✅ 优点

- 零成本上手
- 自带流量和曝光
- 无需维护服务器

&lt;/div&gt;
&lt;div style=&quot;flex: 1; background: rgba(244, 67, 54, 0.1); padding: 1em; border-radius: 8px; border-left: 4px solid #F44336;&quot;&gt;

### ❌ 缺点

- 广告干扰
- 样式不可控
- 数据不完全属于自己
- 可能被限流或审核

&lt;/div&gt;
&lt;/div&gt;</textarea></section><section data-markdown><textarea data-template>## 静态博客生成器

**Jekyll / Hexo / Hugo**

&lt;div style=&quot;display: flex; gap: 2em;&quot;&gt;
&lt;div style=&quot;flex: 1; background: rgba(76, 175, 80, 0.1); padding: 1em; border-radius: 8px; border-left: 4px solid #4CAF50;&quot;&gt;

### ✅ 优点

- 完全掌控内容
- Markdown 写作
- 免费托管 (GitHub Pages)

&lt;/div&gt;
&lt;div style=&quot;flex: 1; background: rgba(244, 67, 54, 0.1); padding: 1em; border-radius: 8px; border-left: 4px solid #F44336;&quot;&gt;

### ❌ 缺点

- 主题定制复杂
- 功能扩展受限
- 部分框架生态老旧

&lt;/div&gt;
&lt;/div&gt;</textarea></section><section data-markdown><textarea data-template>## 文档工具

**VuePress / VitePress**

&lt;div style=&quot;display: flex; gap: 2em;&quot;&gt;
&lt;div style=&quot;flex: 1; background: rgba(76, 175, 80, 0.1); padding: 1em; border-radius: 8px; border-left: 4px solid #4CAF50;&quot;&gt;

### ✅ 优点

- Vue 生态，扩展性强
- 适合技术文档

&lt;/div&gt;
&lt;div style=&quot;flex: 1; background: rgba(244, 67, 54, 0.1); padding: 1em; border-radius: 8px; border-left: 4px solid #F44336;&quot;&gt;

### ❌ 缺点

- 博客功能需要额外配置
- 更偏向文档而非博客

&lt;/div&gt;
&lt;/div&gt;</textarea></section><section data-markdown><textarea data-template>## 痛点总结

&lt;p class=&quot;fragment&quot;&gt;🎨 主题难以满足个性化需求&lt;/p&gt;
&lt;p class=&quot;fragment&quot;&gt;📊 缺少数学公式、图表支持&lt;/p&gt;
&lt;p class=&quot;fragment&quot;&gt;🎬 想要幻灯片演示功能&lt;/p&gt;
&lt;p class=&quot;fragment&quot;&gt;⚡ 追求更好的性能和开发体验&lt;/p&gt;</textarea></section></section><section><section data-markdown><textarea data-template># 第三章

## 我自建的博客系统</textarea></section><section data-markdown><textarea data-template>## 为什么选择 Astro

| 特性 | 说明 |
|------|------|
| **岛屿架构** | 按需加载 JS，极致性能 |
| **框架无关** | 支持 Vue/React/Svelte |
| **内容优先** | 专为内容站点设计 |
| **现代工具链** | Vite 驱动，开发体验好 |</textarea></section><section data-markdown><textarea data-template>## 技术栈

```
Astro 5        静态站点生成
Vue 3          交互式组件
TypeScript     类型安全
Tailwind CSS   原子化样式
Reveal.js      幻灯片演示
```</textarea></section><section data-markdown><textarea data-template>## 核心功能

&lt;p class=&quot;fragment&quot;&gt;✅ Markdown / MDX 支持&lt;/p&gt;
&lt;p class=&quot;fragment&quot;&gt;✅ 代码高亮 (100+ 语言)&lt;/p&gt;
&lt;p class=&quot;fragment&quot;&gt;✅ 数学公式 (KaTeX)&lt;/p&gt;
&lt;p class=&quot;fragment&quot;&gt;✅ 流程图 (Mermaid)&lt;/p&gt;
&lt;p class=&quot;fragment&quot;&gt;✅ 数据可视化 (ECharts)&lt;/p&gt;
&lt;p class=&quot;fragment&quot;&gt;✅ 幻灯片演示 (Reveal.js)&lt;/p&gt;</textarea></section><section data-markdown><textarea data-template>## 内容组织

```
content/
├── posts/           # 博客文章
│   ├── math/       # 数学笔记
│   ├── tools/      # 工具教程
│   └── media/      # 演示文稿
├── pages/          # 静态页面
└── slides/         # 独立幻灯片
```</textarea></section><section data-markdown><textarea data-template>## 特色：提示容器

```markdown
::: tip 提示
这是一个提示
:::

::: warning 警告
这是警告信息
:::

::: danger 危险
这是危险警告
:::
```</textarea></section><section data-markdown><textarea data-template>## 特色：Mermaid 图表

支持多种图表类型：

- 流程图
- 时序图
- 类图
- 甘特图
- 状态图</textarea></section><section data-markdown><textarea data-template>## 特色：幻灯片

三种使用方式：

| 方式 | 说明 |
|------|------|
| 独立幻灯片 | `content/slides/` |
| 文章转幻灯片 | `layout: slides` |
| 嵌入式 | `&lt;Slides&gt;` 组件 |

就像你现在看到的这样！</textarea></section><section data-markdown><textarea data-template>## 开发体验

- 🔥 热更新，实时预览
- 📦 组件化开发
- 🎨 Tailwind 快速样式
- 📝 纯 Markdown 写作</textarea></section></section><section><section data-markdown><textarea data-template># 第四章
