#### Formulas For Rolling Weekly Data

* $\small{\text{Average Completed Topic Per User}} =$
    $\small{\frac{\text{Completed Topic Count in Rolling Weekly}}{\text{Active User Count This Rolling Week}}}$

* $\small{\text{Cumulative Compelted Percentage}} =$
    $\small{\frac{\text{Completed Topic Count Before the End of This Rolling Week}}{36 * \text{(Active User Count Before End Of This Rolling Week)}}}$
